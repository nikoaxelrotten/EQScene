name: Build EQScene VST3 (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target EQScene_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: EQScene-VST3-Windows
          path: build/EQScene_artefacts/Release/VST3/EQScene.vst3
